<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Carbon Passport</title>
    <link rel="stylesheet"
    href="style.css">
</head>
<body>
    <h1 class="heading">Farm details</h1>
    <form id="farm-form" action="/submit-data" method="POST">
        <div class="change-lines">
            <label for="user-name"> Name: </label>
            <input type="text" id="user-name" name="fullname">
        </div>
        
        <div class="change-lines ">
            <label for="farm-area"> Area of the farm:</label>
            <input type="number" id="farm-area" name="farm_area" min="0.01" step="0.001">
            <select id="farm-area" name="hectares-acres">
                <option value="" disabled selected>--Farm Area Unit--</option>
                <option value="Hectares">Hectares(ha)</option>
                <option value="Acres">Acres(ac)</option>
            </select>
        </div>

         <div class="change-lines" id="crop-t">
            <label for="crop-type">Crop Type:</label>
            <select id="crop-type" name="croptype">
                <option value="" disabledselected>--Select</option>
                <option value="Rice">Rice</option>
                <option value="Others">Others</option>
            </select>
        </div>
        
        <div class="change-lines hide-field" id="irrigation">
            <label for="water"> Water Irrigation:</label>
            <select id="water" name="irrigation">
                <option value="Continously flooded">Continously Flooded</option>
                <option value="Intermittently flooded">Intermittently Flooded</option>
                <option value="Rain-fed">Rain fed</option>
            </select>
        </div>

        <div class="change-lines hide-field" id="fert-type">
            <label for="fertilizer">Fertilizer Type:</label>
            <select id="fertilizer" name="fertilizer-type">
                <option value="Urea">Urea</option>
                <option value="Other nitrogen fertilizer">Other nitrogen fertilizer</option>
                <option value="None">None</option>
            </select>
        </div>

        <div class="change-lines hide-field" id="fert-amount">
            <label for="amount-fertilizer">Fertilizer Amount (Kg):<label>
            <input type="number" id="amount-fertilizer" name="fertilizer_amount" min="0.1" step="0.01">
        </div>

        <div class="change-lines hide-field" id="crop-residue">
            <label for="crop-residue-management">Crop residue management:</label>
            <select id="crop-residue-management" name="crop_residue_management">
                <option value="" disabledselected>--Select--</option>
                <option value="Burned"> Burned</option>
                <option value="Left_in_field">Left in field</option>
                <option value="Incorporated_into_soil">Incorporated into soil</option>
                <option value="Removed/Used_elsewhere">Removed/Used elsewhere</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="change-lines" id="residue-percentage">
            <label for="residue" >Approximately what percentage of the crop residue is burned?</label>
            <input type="number" id="residue" name="percentage-burned" min="0" max="100" step="0.01">
            <label for="rice-produce">How much rice did you produce this season (Kg)?</label>
            <input type="number" id="rice-produce" name="rice-produce" min="0.01" step="0.01">
        </div>

        <div class="change-lines hide-field" id="diesel-y-n">
            <label for="diesel">Do You Use Diesel?</label> 
            <select id="diesel" name="Diesel_use">
                <option value="" disabledselected>--Select--</option>
                <option value="yes">Yes</option>
                <option value="no">No</option>
            </select>
        </div>

        <div class="change-lines hide-field" id="diesel_used">
            <label for="litres">Diesel used(litres/season)</label>
            <input type="number" id="litres" name="diesel-used" min="0" step="0.01">
        </div>
    

        <div class="change-lines" id="crop-error">
            <label>
            Carbon calculation for this crop is not available yet.</label>
            </div>

        <div class="change-lines" id="residue-error">
            <label>This farming practice is not supported yet. Please select "Burned" to continue.</label>
        </div>

        <button type="submit" id="calculate-button">Calculate Carbon Impact</button>
        

    
    </form>     
    <script src="script.js"></script>
</body>
</html>
